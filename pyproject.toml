[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-satellite-coverage-risk"
version = "0.1.0"
description = "Agent-driven pipeline that scores ~1M GPS locations for LEO satellite (Starlink) obstruction risk using NLCD tree canopy, USGS 3DEP terrain, and NLCD land cover."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Drashti Shah", email = "drashtipshah23@gmail.com" }
]
license = { text = "MIT" }
keywords = ["leo", "satellite", "starlink", "geospatial", "risk-analysis", "anthropic", "agent"]

dependencies = [
    "anthropic>=0.40.0",
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "pyproj>=3.6.0",
    "duckdb>=0.10.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "folium>=0.15.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "shapely>=2.0.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.urls]
"Challenge" = "https://github.com/ready/builders-challenge/issues/50"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
